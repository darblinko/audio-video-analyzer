[project]
name = "audio-video-analyzer"
version = "0.2.0"
description = "Browser audio and video capture with librosa feature extraction, optional Gemini video description, SQLite storage and WebSocket progress."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Mitchell Foutz" }]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20",
    "fastapi>=0.115",
    "google-genai>=1.0",
    "librosa>=0.11",
    "numpy>=2.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.18",
    "uvicorn[standard]>=0.32",
]

[project.urls]
Repository = "https://github.com/darblinko/audio-video-analyzer"

[project.scripts]
av-analyzer = "av_analyzer.cli:main"

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8.3", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/av_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Starlette warns that its TestClient will move from httpx to httpx2; the tests still use httpx.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
